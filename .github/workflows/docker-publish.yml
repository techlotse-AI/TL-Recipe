name: Create Docker Container

# Continuous build of main. This workflow owns MUTABLE development tags only:
#   :main, :main-<short-sha>, :<date>
#
# The release tags :v<version> and :latest belong exclusively to release.yml,
# which runs on v* tags. Publishing :v<version> from here read VERSION on every
# push, which made it a rolling pointer to main rather than a release artifact
# — it was republished 12 times before v0.9.0 was ever tagged, and would have
# silently overwritten a published release on the next merge.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect build metadata
        id: meta
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          # Mutable dev tags only — see the header comment. Never add
          # :v<version> or :latest here; release.yml owns those.
          tags: |
            techlotse/tl-recipe-core:main
            techlotse/tl-recipe-core:main-${{ steps.meta.outputs.sha_short }}
            techlotse/tl-recipe-core:${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
