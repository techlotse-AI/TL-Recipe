version: 2
updates:
  # Root npm workspaces (backend + frontend share the root lockfile)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # GitHub Actions used by the CI and release workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    ignore:
      # Node majors are adopted deliberately, not on Dependabot's schedule.
      # The Dockerfile pins npm@12.0.1 (tar CVE-2026-59873, 3cbe9fe), whose
      # engines field is "^22.22.2 || ^24.15.0 || >=26.0.0" — Node 25 is
      # excluded outright, so 24 -> 25 cannot build (#24). Node 25 is also
      # not an LTS line, while engines.node is ">=24.0.0" and CI runs 24.
      # Revisit when Node 26 goes LTS; patch/minor bumps still flow through.
      - dependency-name: node
        update-types:
          - version-update:semver-major
